version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container-name: billmint-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=billmint_super_secret_jwt_key_2026
    depends_on:
      - mongodb

  web-app:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api

  dashboard-app:
    build: ./apps/dashboard
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:5000/api

  admin-app:
    build: ./apps/admin
    ports:
      - "3002:3002"
    environment:
      - VITE_API_URL=http://localhost:5000/api

volumes:
  mongo_data:

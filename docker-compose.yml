version: '3.8'

services:
  # MongoDB Atlas / Self-Hosted Service
  mongodb:
    image: mongo:latest
    container_name: billmint-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # BillMint Backend API Service
  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
    depends_on:
      - mongodb
    restart: unless-stopped

  # BillMint Marketing Web App
  web-app:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    restart: unless-stopped

  # BillMint Client Dashboard App
  dashboard-app:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
      - VITE_RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
    restart: unless-stopped

  # BillMint Super Admin Console App
  admin-app:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    restart: unless-stopped

volumes:
  mongo_data:
